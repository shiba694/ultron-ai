services:

  # ─── Zookeeper ───────────────────────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: ultron-zookeeper
    restart: unless-stopped
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      KAFKA_HEAP_OPTS: "-Xmx256m -Xms128m"
    deploy:
      resources:
        limits:
          memory: 384M
    healthcheck:
      test: ["CMD", "bash", "-c", "echo 'ruok' | nc localhost 2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Kafka Broker ────────────────────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: ultron-kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms256m"
    deploy:
      resources:
        limits:
          memory: 800M
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 10

  # ─── PostgreSQL + pgvector ───────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ultron-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ultron}
      POSTGRES_USER: ${POSTGRES_USER:-ultron}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ultron123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ultron -d ultron"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ultron-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--maxmemory", "200mb", "--maxmemory-policy", "allkeys-lru"]
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── ultron-api (Gateway) ────────────────────────────────────────────────────
  ultron-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: ultron-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8084:8084"
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx350m -Xms200m"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ultron}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-ultron}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-ultron123}
      ULTRON_API_KEY: ${ULTRON_API_KEY:-ultron-default-api-key}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      INGESTION_URL: http://ultron-ingestion:8081
      DETECTOR_URL: http://ultron-detector:8082
      RCA_URL: http://ultron-rca:8083
    deploy:
      resources:
        limits:
          memory: 550M

  # ─── ultron-ingestion ────────────────────────────────────────────────────────
  ultron-ingestion:
    build:
      context: .
      dockerfile: Dockerfile.ingestion
    container_name: ultron-ingestion
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx300m -Xms150m"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ultron}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-ultron}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-ultron123}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SERVER_PORT: 8081
    deploy:
      resources:
        limits:
          memory: 450M

  # ─── ultron-detector ─────────────────────────────────────────────────────────
  ultron-detector:
    build:
      context: .
      dockerfile: Dockerfile.detector
    container_name: ultron-detector
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8082:8082"
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx350m -Xms200m"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ultron}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-ultron}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-ultron123}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SERVER_PORT: 8082
    deploy:
      resources:
        limits:
          memory: 450M

  # ─── ultron-rca ──────────────────────────────────────────────────────────────
  ultron-rca:
    build:
      context: .
      dockerfile: Dockerfile.rca
    container_name: ultron-rca
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx350m -Xms200m"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ultron}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-ultron}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-ultron123}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SERVER_PORT: 8083
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:openrouter}
    deploy:
      resources:
        limits:
          memory: 550M

volumes:
  postgres_data:
    driver: local
